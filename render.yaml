# Render Blueprint — one-click backend + Postgres for FitTrack.
# Usage: push this repo to GitHub → Render Dashboard → New → Blueprint → pick repo.
# After the frontend (Vercel) URL exists, set CLIENT_URL on fittrack-server and redeploy.
# NOTE: Render's free Postgres expires after 90 days. For a permanent free DB,
# create one at neon.tech instead and set DATABASE_URL manually on the service.

databases:
  - name: fittrack-db
    databaseName: fittrack
    user: fittrack

services:
  - type: web
    name: fittrack-server
    runtime: node
    rootDir: server
    # No migrations folder in this repo (schema is synced with db push),
    # so the build syncs the schema directly, then generates the client.
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fittrack-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # <-- paste the Vercel URL here after deploying the frontend
